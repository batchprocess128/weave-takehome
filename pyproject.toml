[project]
name = "weave-takehome"
version = "0.1.0"
description = "PostHog engineering impact dashboard and optional Postgres tutorial track"
readme = "README.md"
requires-python = ">=3.12"
# fetch.py and analyze.py stay stdlib-only; optional groups below.
dependencies = [
    "pydantic-ai>=2.33.0",
]

[dependency-groups]
db = [
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "scikit-learn>=1.5",
]

[tool.uv]
default-groups = ["db", "notebook"]
